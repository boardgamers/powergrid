name: Viewer - Test
on:
    push:
        paths:
            - '.github/workflows/viewer-test.yml'
            - 'viewer/**'
        branches:
            - master
    pull_request:
        paths:
            - '.github/workflows/viewer-test.yml'
            - 'viewer/**'

permissions:
    contents: read

defaults:
    run:
        working-directory: viewer

jobs:
    test_and_build:
        runs-on: ubuntu-latest
        env:
            NODE_OPTIONS: --openssl-legacy-provider
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '24'
            - run: corepack enable
            - run: pnpm install
            # - run: pnpm lint
            # - run: pnpm test
            - run: pnpm build
            - run: pnpm --dir ../engine build
            - run: pnpm package
            - run: pnpm test:unit
            - run: pnpm test:tutorial
            - run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:browser
            - run: pnpm test:tutorial:browser
            - run: node scripts/premove-smoke.mjs
